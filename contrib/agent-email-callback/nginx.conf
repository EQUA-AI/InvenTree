worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location = / { try_files /index.html =404; }
        location = /microsoft/callback { try_files /index.html =404; }
        location = /callback.js { try_files $uri =404; }
        location = /style.css { try_files $uri =404; }
        location = /healthz { return 200 'ok'; }
        location / { return 404; }
    }
}
