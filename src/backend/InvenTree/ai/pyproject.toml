[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimms-backend"
version = "0.1.0"
description = "AIMMS - AI-Powered Intelligent Manufacturing Management System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "AIMMS Team" }
]
keywords = ["manufacturing", "ai", "agents", "maf", "inventree"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Microsoft Agent Framework
    "agent-framework>=1.1.0",
    "agent-framework-azure>=1.1.0",
    "agent-framework-devui>=1.0.0",

    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",

    # Configuration & Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # HTTP Client
    "httpx>=0.27.0",

    # Azure Services
    "azure-identity>=1.19.0",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-storage-blob>=12.23.0",

    # Gmail Integration
    "google-auth>=2.35.0",
    "google-api-python-client>=2.150.0",

    # Logging & Observability
    "structlog>=24.4.0",

    # Utilities
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "respx>=0.21.0",
]

[project.scripts]
aimms = "aimms_backend.cli:main"

[project.urls]
Documentation = "https://github.com/aimms/aimms-backend#readme"
Issues = "https://github.com/aimms/aimms-backend/issues"
Source = "https://github.com/aimms/aimms-backend"

[tool.hatch.build.targets.wheel]
packages = ["aimms_backend"]

# djlint resolves its config from the linted files' nearest pyproject.toml, so
# the CI hook needs the repo-root ignore list mirrored here for ai/ templates
[tool.djlint]
ignore = "D018,H006,H008,H020,H021,H023,H025,H030,H031,T002"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["aimms_backend", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "ARG001", # unused function argument
    "ARG002", # unused method argument (Protocol stubs / framework callbacks)
]

[tool.ruff.lint.isort]
known-first-party = ["aimms_backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "googleapiclient.*",
    "agent_framework.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires InvenTree)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow tests",
    "golden: S39 golden-set gate (live deployment; AIMMS_GOLDEN_LIVE=1 + creds)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["aimms_backend"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
