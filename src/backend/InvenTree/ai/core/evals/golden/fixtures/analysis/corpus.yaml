# S14 synthetic analysis corpus (§13.4) — the ONE declared source.
#
# `seed_analysis_eval_fixtures` creates exactly what this file declares;
# the fixture battery's assertions (counts, dates, revisions) derive from
# the same numbers. Everything here is fictional and sanitized. Entity
# identities (names/serials/clients) live in battery/fixture_keys.yaml —
# this file holds the DATA those entities carry.

version: aimms-analysis-fixtures-v2

work_orders:
  # >25 per primary asset (§13.4); date defects are deliberate.
  solar_a:
    total: 28
    base_date: 2024-01-15
    step_days: 11
    missing_completion: 6      # actual_completed_at null
    conflicting_dates: 2       # completed BEFORE started
    created_only: 4            # neither started nor completed
  solar_b:
    total: 31
    base_date: 2024-02-01
    step_days: 9
    missing_completion: 5
    conflicting_dates: 1
    created_only: 3

special_work_orders:
  wo_incomplete_a:
    reference: WO-EVAL-SI3000A-OPEN
    title: Frame bolt torque check (open)
    machine_key: solar_a
    completed: false
    maintenance_record: false
  wo_complete_a:
    reference: WO-EVAL-SI3000A-DONE
    title: Coolant flush (completed)
    machine_key: solar_a
    completed: true
    maintenance_record: true

# Recorded stages that deliberately do NOT imply one another (§13.4):
# a symptom that the action does not address, an outcome that neither
# confirms nor closes the symptom.
maintenance_stages:
  - symptom: DC overvoltage alarm on string 3
    action: Replaced AC surge arrester
    outcome: Alarm persists intermittently
  - symptom: Coolant temperature high warning
    action: Cleaned cabinet air filters
    outcome: No change recorded at close
  - symptom: Ground fault indication after rain
    action: Re-torqued AC output lugs
    outcome: Returned to service; observation ongoing

