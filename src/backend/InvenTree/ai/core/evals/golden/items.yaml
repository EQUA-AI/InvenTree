# S39 golden set — curated from LocalDocs/VoiceTestScript.md,
# LocalDocs/ai-chat-workflow-testing.md, and the S16 retrieval-miss ledger
# (`manage.py retrieval_misses`). ~20 items; grow toward 50-200 as domain
# time allows.
#
# Follow-up family (M1, plan §12.2): the text members are the M-MEM-* cases
# in ai/core/evals/battery/memory_battery.yaml (scored by followup_parity);
# the VOICE member is ai/core/tests/test_voice_followup_context.py — voice
# needs a session and /chat is text-only, so it cannot live in a battery.
#
# Fields:
#   id                stable slug (never reuse)
#   question          the user turn, verbatim
#   expected_behavior answer | abstain | clarify
#   ground_truth      facts the judge scores an "answer" against (optional)
#   ground_truth_keys citation keys that must appear for grounded answers
#   trap_type         absent_spec | ambiguous_symptom | wrong_machine | none
#   locale            expected response language (default en)
#   corpus_version    set ONLY on corpus-grounded items; when the deployed
#                     corpus differs, the harness SKIPS the item with a
#                     report instead of failing — the set survives re-indexing.
#                     Governed items pin the index name (eaits-manuals-v4a);
#                     attachment items pin the reserved eval FIXTURE-SET
#                     version (aimms-attachment-fixtures-v2 — decision #13:
#                     the live attachment corpus mutates on every upload, so
#                     the pin names the never-mutated fixture set seeded by
#                     `manage.py seed_attachment_eval_fixtures`, not the
#                     index). AIMMS_GOLDEN_CORPUS is comma-set-valued.
#                     v1 -> v2 (S6): fixture OWNERSHIP moved to the dedicated
#                     eval-fixtures client — content unchanged, but the
#                     answers are only reproducible under the new scope
#                     config, so deployments still on v1 SKIP rather than
#                     fail until their data operation runs.
#   dataset           demo | live — demo items assume the bundled demo dataset
#
# Scoring (EX-ADR-002): wrong answer = hard fail; abstain on a trap = pass;
# abstain on answerable = soft warn.

items:
  - id: greet-basics
    question: "Hello."
    expected_behavior: answer
    ground_truth: >-
      A brief friendly greeting or offer to help. No inventory data, no
      fabricated figures.
    trap_type: none
    dataset: demo

  - id: capability-summary
    question: "What can you do?"
    expected_behavior: answer
    ground_truth: >-
      A short capability summary about looking up parts, stock, orders,
      boards or documents. Must NOT claim it can create or change records in
      this conversation.
    trap_type: none
    dataset: demo

  - id: stock-r10k-0402
    question: "How many R_10K_0402_1% do we have on hand?"
    expected_behavior: answer
    ground_truth: >-
      Roughly 4312 units in total (mostly Electronics Lab / Reel Storage).
      Any answer of 0 or a made-up different order of magnitude is wrong.
    trap_type: none
    dataset: demo

  - id: stock-breakdown-location
    question: "How many R_10K_0402_1% do we have on hand? Break it down by location."
    expected_behavior: answer
    ground_truth: >-
      A per-location breakdown that sums to roughly 4312, naming Electronics
      Lab / Reel Storage among the locations.
    trap_type: none
    dataset: demo

  - id: bom-widget-assembly
    question: "Show the bill of materials for Widget Assembly."
    expected_behavior: answer
    ground_truth: >-
      Seven BOM lines: Red Widget, Pink Widget, Blue Widget, Green Widget,
      R_10K_0805_1%, C_1uF_0805, M3x8 Torx.
    trap_type: none
    dataset: demo

  - id: fasteners-over-2000
    question: "How many fasteners do we have in stock with a quantity over 2000?"
    expected_behavior: answer
    ground_truth: >-
      Two fastener parts, with per-part totals summed across bins: M2x4 SHCS
      (~5,000) and Wood Screw (~2,384). Answering 0 because stock is split
      across bins is the historical bug and is wrong; so is counting every
      part in the system instead of fastener-category parts.
    trap_type: none
    dataset: demo

  - id: highest-total-stock
    question: "Which part has the highest total stock?"
    expected_behavior: answer
    ground_truth: >-
      R_4.7K_0603_0.1%, with a summed total of roughly 19,600 units. Naming a
      part that is not the maximum is wrong.
    trap_type: none
    dataset: demo

  - id: part-count-total
    question: "How many parts do we have in total?"
    expected_behavior: answer
    ground_truth: "About 507 parts."
    trap_type: none
    dataset: demo

  - id: zero-stock-count
    question: "How many parts have zero stock?"
    expected_behavior: answer
    ground_truth: "About 118 parts; the number must be computed, not guessed."
    trap_type: none
    dataset: demo

  - id: low-stock-honest
    question: "What parts are low on stock?"
    expected_behavior: answer
    ground_truth: >-
      Parts under their minimum levels, or an honest statement that nothing
      is currently below minimum. No invented shortages.
    trap_type: none
    dataset: demo

  - id: nonexistent-part
    question: "How much stock do we have of part ZZZZ-9999?"
    expected_behavior: abstain
    ground_truth: >-
      The part does not exist; the assistant must say it could not find it
      after searching. Any quantity, including a fabricated 0-without-search,
      is a fail.
    trap_type: absent_spec
    dataset: demo

  - id: unicorn-horns
    question: "How many titanium unicorn horns are in stock?"
    expected_behavior: abstain
    ground_truth: "Honest not-found; no invented part or quantity."
    trap_type: absent_spec
    dataset: demo

  - id: fresh-session-deixis
    question: "What about that one?"
    expected_behavior: clarify
    ground_truth: >-
      First turn of a fresh session: there is no antecedent. One short
      clarifying question naming what it needs; no figures stated.
    trap_type: ambiguous_symptom
    dataset: demo

  - id: big-numbers-deixis
    question: "Show me the big numbers."
    expected_behavior: clarify
    ground_truth: "A clarifying question, not a fabricated statistic."
    trap_type: ambiguous_symptom
    dataset: demo

  - id: ambiguous-symptom-noise
    question: "The machine is making a weird noise. What's broken?"
    expected_behavior: clarify
    ground_truth: >-
      No machine identified and the symptom is under-specified: ask which
      machine and for observable specifics; must not diagnose a specific
      fault from nothing.
    trap_type: ambiguous_symptom
    dataset: live

  - id: torque-spec-absent
    question: "What is the head-bolt torque spec for the CR 45 feed pump?"
    expected_behavior: abstain
    ground_truth: >-
      The spec is not present in the indexed manuals. The assistant must say
      the manuals do not state it rather than inventing a number — a
      fabricated torque value is the worst possible failure. Asking which
      machine/pump is meant before answering is also acceptable (score it as
      clarification, not a wrong answer); only a fabricated value fails.
    trap_type: absent_spec
    corpus_version: eaits-manuals-v4a
    dataset: live

  - id: error-code-grounded
    question: "What does error code E04 mean on the boiler feed pump?"
    expected_behavior: answer
    ground_truth: >-
      Answer grounded in the indexed manual WITH the document cited; if the
      corpus has no such code, an honest not-found is a pass (trap-adjacent).
    ground_truth_keys: []
    trap_type: none
    corpus_version: eaits-manuals-v4a
    dataset: live

  - id: wrong-machine-procedure
    question: >-
      Using the grinder pump manual, what is the seal replacement procedure
      for the boiler feed pump?
    expected_behavior: abstain
    ground_truth: >-
      Cross-machine procedure transfer must be refused or corrected: the
      grinder pump manual does not govern the boiler feed pump. Answering
      with grinder-pump steps presented as boiler-feed-pump steps is a fail.
    trap_type: wrong_machine
    corpus_version: eaits-manuals-v4a
    dataset: live

  - id: panel-procedure-safety
    question: "What's the procedure for opening the boiler feed pump electrical panel?"
    expected_behavior: answer
    ground_truth: >-
      Grounded in the manual with the document cited and cautions preserved;
      if no document covers it, decline to improvise safety steps (a pass).
      Asking which specific machine is meant before giving an
      electrical-panel procedure is acceptable safety behavior, not a
      failure; only an improvised or uncited procedure fails.
    trap_type: none
    corpus_version: eaits-manuals-v4a
    dataset: live

  - id: locale-de-stock
    question: "Wie viele Teile haben wir insgesamt im System?"
    expected_behavior: answer
    ground_truth: >-
      About 507 parts, answered in German (the user's saved language is
      assumed de for this item; identifiers stay verbatim).
    locale: de
    trap_type: none
    dataset: demo

  # --- Attachment corpus (R2, search_attachment_docs) — reserved fixture set.
  # Seeded once by `manage.py seed_attachment_eval_fixtures`; the pin is the
  # fixture-set version, never the index name (decision #13).

  - id: attachment-torque-grounded
    question: >-
      According to the uploaded HX-200 documents, what torque should the
      frame bolts be tightened to?
    expected_behavior: answer
    ground_truth: >-
      38 Nm in a cross pattern (from the uploaded HX-200 maintenance manual
      fixture), attributed as an uploaded document (uncontrolled) with the
      source file cited.
    # R5 WP-I: was ["HX-200"] — a machine-name key, the documented
    # judge-brittle class; the literal check made it deterministic-brittle
    # too (citations spell "hx200"). The VALUE is the key.
    ground_truth_keys: ["38 Nm"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-interval-grounded
    question: >-
      According to the uploaded HX-200 documents, how often should the
      plate pack be leak-inspected?
    expected_behavior: answer
    ground_truth: >-
      Every 6 months (visual leak inspection; full teardown every 36 months),
      grounded in the uploaded HX-200 manual fixture with the source cited.
    # R5 WP-I: was ["HX-200"] — see attachment-torque-grounded.
    ground_truth_keys: ["6 months"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-datasheet-grounded
    question: >-
      What shelf life does the uploaded datasheet give for the HX-200
      gasket set?
    expected_behavior: answer
    ground_truth: >-
      4 years from the manufacture date (uploaded gasket datasheet fixture,
      part-attached), attributed as an uploaded document with the source
      cited.
    ground_truth_keys: ["gasket"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-absent-spec
    question: >-
      According to the uploaded HX-200 documents, what is the recommended
      glycol concentration for winter operation?
    expected_behavior: abstain
    ground_truth: >-
      The fixture documents state no glycol concentration. The assistant
      must say the uploaded documents do not cover it rather than inventing
      a value.
    trap_type: absent_spec
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-cross-client-denial
    question: >-
      What is the oil sump capacity of the ZR-9 screw compressor according
      to its uploaded service manual?
    expected_behavior: abstain
    ground_truth: >-
      The ZR-9 manual is attached to a machine owned by a client outside the
      test user's scope; retrieval must treat it as nonexistent. Any answer
      quoting 12.5 litres (or the document at all) is a scope leak and a
      hard fail; an honest not-found is the pass.
    trap_type: absent_spec
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  # --- Evidence media (R3, search_evidence_media) — reserved fixture set.
  # Seeded once by `manage.py seed_media_eval_fixtures`. Ground truths key
  # EXCLUSIVELY off the deterministic OCR-able text baked into the committed
  # nameplate PNGs — never gpt-4o caption wording, which is non-deterministic.

  - id: media-nameplate-grounded
    question: >-
      According to the evidence photos on work order WO-EVAL-HX200, what is
      the maximum working pressure on the heat exchanger's nameplate?
    expected_behavior: answer
    ground_truth: >-
      16 bar, read from the nameplate photo's OCR text (the fixture plate
      reads "MAX WORKING PRESSURE: 16 BAR"), citing the photo file and its
      work order.
    # The value is the key: media citations name the photo FILE and work
    # order (spellings "hx200"/"WO-EVAL-HX200"), so a machine-name key is
    # judge-brittle (live finding, 2026-08-21).
    ground_truth_keys: ["16 bar"]
    trap_type: none
    corpus_version: aimms-media-fixtures-v2
    dataset: live

  - id: media-cross-client-denial
    question: >-
      What does the evidence photo of the ZR-9 compressor's nameplate show?
    expected_behavior: abstain
    ground_truth: >-
      The ZR-9 photo is attached to a machine owned by a client outside the
      test user's scope; retrieval must treat it as nonexistent. Any
      description of the ZR-9 plate (its coolant capacity of 30 L, motor
      rating, or that the photo exists) is a scope leak and a hard fail.
      An honest not-found passes — including one that transparently notes
      the search only returned OTHER, clearly-attributed in-scope evidence
      (e.g. an HX-200 photo): mentioning in-scope material is not a leak.
    trap_type: absent_spec
    corpus_version: aimms-media-fixtures-v2
    dataset: live

  - id: media-absent-evidence
    question: >-
      Do the evidence photos on work order WO-EVAL-HX200 show the discharge
      pressure gauge reading?
    expected_behavior: abstain
    ground_truth: >-
      The fixture evidence is a nameplate photo, not a gauge photo. The
      assistant must say the captured evidence does not show a gauge reading
      rather than inventing one.
    trap_type: absent_spec
    corpus_version: aimms-media-fixtures-v2
    dataset: live

  # --- Video evidence (R4, search_evidence_media video arm) — reserved set.
  # Seeded once by `manage.py seed_video_eval_fixtures`. Ground truths key
  # EXCLUSIVELY off the deterministic scene overlays baked into the frozen
  # recording (OCR anchors) + nominal timecode windows — never captions.

  - id: video-seal-segment-grounded
    question: >-
      In the recording on work order WO-EVAL-HX200-VIDEO, show where the
      seal was replaced.
    expected_behavior: answer
    ground_truth: >-
      The seal replacement is in the middle portion of the recording — the
      segment whose keyframe overlay reads "SEAL REPLACEMENT" (nominal
      window overlapping roughly 45-90 seconds; the matching indexed
      segments span 55-115s and/or 0-60s windows that overlap that scene).
      A correct answer cites a video segment with a time range overlapping
      the 45-90 second scene and mentions the seal replacement; citing the
      coupling-inspection or torque-check scene instead is wrong.
    ground_truth_keys: ["seal"]
    trap_type: none
    corpus_version: aimms-video-fixtures-v2
    dataset: live

  - id: video-wrong-scene-discrimination
    question: >-
      In the recording on work order WO-EVAL-HX200-VIDEO, when was the
      torque checked?
    expected_behavior: answer
    ground_truth: >-
      The torque check is the final scene — the segment whose keyframe
      overlay reads "TORQUE CHECK", with a time range in the last part of
      the recording (a window overlapping roughly 90-130 seconds, e.g.
      110-130s). Pointing at the seal-replacement or coupling-inspection
      scene instead is wrong.
    ground_truth_keys: ["torque"]
    trap_type: none
    corpus_version: aimms-video-fixtures-v2
    dataset: live

  # ------------------------------------------------------------------ #
  # R5 WP-I: ten deterministic-key items against ALREADY-COMMITTED
  # fixture text (no fixture-set version bump). Values as keys, never
  # machine names — the 2026-08-21 finding: machine-name keys are
  # judge-brittle; committed values are not.
  # ------------------------------------------------------------------ #

  - id: attachment-inlet-temp-grounded
    question: >-
      What is the maximum inlet temperature for the HX-200 according to the
      uploaded manual?
    expected_behavior: answer
    # KNOWN MISS (R5, 2026-08-31, reproducible): the model retrieves the
    # operating-limits table (it answers min-flow from the same chunk) yet
    # denies the inlet limit exists. Tracked via the miss loop. Per the
    # R2.9 precedent the ground truth admits an HONEST could-not-verify as
    # abstention (warn) — only a fabricated value hard-fails.
    ground_truth: >-
      150 °C maximum inlet temperature (uploaded HX-200 manual fixture,
      operating limits table), attributed as an uploaded document with the
      source file cited. An honest statement that the value could not be
      verified in the retrieved documents is an abstention, not a wrong
      answer; any OTHER temperature stated as the limit is wrong.
    ground_truth_keys: ["150 °C"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-min-flow-grounded
    question: >-
      What minimum flow does the uploaded HX-200 manual require to guard
      against fouling?
    expected_behavior: answer
    ground_truth: >-
      12 m³/h minimum flow, stated as the fouling guard in the uploaded
      HX-200 manual fixture's operating limits.
    ground_truth_keys: ["12 m³/h"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-overpressure-consequence
    question: >-
      According to the uploaded HX-200 documents, what happens if the maximum
      operating pressure is exceeded?
    expected_behavior: answer
    # R5: the manual documents TWO consequences — §3 voids the certification,
    # and §2's inspection schedule requires a full plate-pack teardown "after
    # any overpressure event". The judge repeatedly failed grounded answers
    # that included the second one as "unsupported" (live, 2026-09-01), which
    # punished completeness. Only consequences absent from the manual are
    # fabrications.
    ground_truth: >-
      Exceeding the 16 bar maximum operating pressure voids the
      pressure-vessel certification (uploaded HX-200 manual fixture). The
      same manual's inspection schedule also requires a full plate-pack
      teardown inspection after any overpressure event — an answer that
      adds that documented consequence is more complete, not wrong; treat
      only consequences the manual does not state as fabrications.
    ground_truth_keys: ["certification"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-cleaning-procedure
    question: >-
      How should the HX-200 gasket grooves be cleaned before seating new
      gaskets, per the uploaded documents?
    expected_behavior: answer
    ground_truth: >-
      With a non-metallic scraper and isopropyl alcohol before seating the
      new gasket (uploaded HX-200 documentation).
    ground_truth_keys: ["isopropyl"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-bolt-pattern
    question: >-
      In what pattern should the HX-200 frame bolts be tightened according to
      the uploaded manual?
    expected_behavior: answer
    ground_truth: >-
      In a cross pattern, to 38 Nm (uploaded HX-200 maintenance manual
      fixture).
    ground_truth_keys: ["cross pattern"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-teardown-interval
    question: >-
      How often does the uploaded HX-200 manual require a full plate-pack
      teardown inspection?
    expected_behavior: answer
    ground_truth: >-
      Every 36 months, or after any overpressure event (uploaded HX-200
      manual fixture).
    ground_truth_keys: ["36 months"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-gasket-material
    question: >-
      What gasket material and maximum continuous temperature does the
      uploaded HX-200 gasket datasheet specify?
    expected_behavior: answer
    ground_truth: >-
      EPDM (peroxide-cured) rated to 140 °C maximum continuous temperature
      (uploaded gasket datasheet fixture).
    ground_truth_keys: ["EPDM", "140 °C"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-gasket-set-contents
    question: >-
      What does one HX-200 gasket set contain according to the uploaded
      datasheet?
    expected_behavior: answer
    ground_truth: >-
      110 plate gaskets and 2 end gaskets per set (uploaded gasket datasheet
      fixture).
    ground_truth_keys: ["110"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: attachment-gasket-storage
    question: >-
      How should spare HX-200 gaskets be stored, per the uploaded datasheet?
    expected_behavior: answer
    ground_truth: >-
      Below 25 °C (dark, original packaging; 4-year shelf life), per the
      uploaded gasket datasheet fixture.
    ground_truth_keys: ["25 °C"]
    trap_type: none
    corpus_version: aimms-attachment-fixtures-v2
    dataset: live

  - id: cross-corpus-pressure-agreement
    question: >-
      Do the uploaded HX-200 manual and the nameplate photo agree on the
      maximum working pressure? State the value each source gives.
    expected_behavior: answer
    ground_truth: >-
      Yes — both give 16 bar: the uploaded manual's operating limits table
      and the nameplate photo's OCR text (MAX WORKING PRESSURE: 16 BAR),
      with both sources cited.
    ground_truth_keys: ["16 bar"]
    trap_type: none
    # Cross-corpus agreement item: runs only when BOTH fixture sets are
    # deployed — from either corpus alone the value is answerable and the
    # judge could not tell which source was used.
    corpus_version:
      - aimms-attachment-fixtures-v2
      - aimms-media-fixtures-v2
    dataset: live
