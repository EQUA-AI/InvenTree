<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RV15 mounted voice drawer fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Mount-failure diagnostics: capture module/render errors for the spec.
      window.__rv15Errors = [];
      window.addEventListener('error', (e) =>
        window.__rv15Errors.push(String(e.message || e.error))
      );
      window.addEventListener('unhandledrejection', (e) =>
        window.__rv15Errors.push(String(e.reason))
      );
    </script>
    <script type="module" src="./voice-rv15.tsx"></script>
  </body>
</html>
