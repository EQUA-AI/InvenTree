<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" fill="none" stroke="var(--mimic-line, #495057)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <!-- Motor floor: the motor stands on it, the pump hangs below it. -->
  <path d="M300 312h241v12H300zM559 312h241v12H559z" fill="var(--mimic-structure, #dee2e6)" stroke="var(--mimic-muted, #adb5bd)" stroke-width="1"/>

  <!-- Electrical supply into the terminal box. -->
  <circle cx="300" cy="150" r="15" fill="var(--mimic-surface, #f8f9fa)"/>
  <path d="M291 150q4.5-9 9 0t9 0" stroke-width="1.6"/>
  <path d="M315 150h125"/>
  <rect x="440" y="128" width="34" height="44" rx="4" fill="var(--mimic-surface, #f8f9fa)"/>

  <!-- Motor ventilation and cooling: the fan cowl and the air cooler. -->
  <g id="part-air-cooling" data-part="PS-AIR-COOLING" stroke="var(--mimic-part-air-cooling, var(--mimic-line, #495057))">
    <rect x="500" y="46" width="100" height="16" rx="6" fill="var(--mimic-surface, #f8f9fa)"/>
    <rect x="626" y="118" width="44" height="88" rx="4" fill="var(--mimic-surface, #f8f9fa)"/>
    <path d="M634 136h28M634 152h28M634 168h28M634 184h28" stroke-width="1.4"/>
  </g>

  <!-- Motor non-drive-end bearing, at the top of a vertical motor. -->
  <g id="part-motor-nde-bearing" data-part="PS-MOTOR-NDE-BRG" stroke="var(--mimic-part-motor-nde-bearing, var(--mimic-line, #495057))">
    <rect x="518" y="70" width="64" height="22" rx="4" fill="var(--mimic-surface, #f8f9fa)"/>
    <circle cx="536" cy="81" r="5"/>
    <circle cx="564" cy="81" r="5"/>
  </g>

  <!-- Motor frame. Its fill is the bay's state. -->
  <g id="part-motor" data-part="PS-MOTOR" stroke="var(--mimic-part-motor, var(--mimic-state-line, #495057))">
    <rect x="474" y="92" width="152" height="140" rx="10" fill="var(--mimic-state, #e9ecef)"/>
    <path d="M500 110v104M525 110v104M550 110v104M575 110v104M600 110v104" stroke-width="1.2" opacity=".4"/>
  </g>

  <!-- Motor drive-end bearing, at the shaft end. -->
  <g id="part-motor-de-bearing" data-part="PS-MOTOR-DE-BRG" stroke="var(--mimic-part-motor-de-bearing, var(--mimic-line, #495057))">
    <rect x="518" y="232" width="64" height="20" rx="3" fill="var(--mimic-surface, #f8f9fa)"/>
    <circle cx="536" cy="242" r="4.5"/>
    <circle cx="564" cy="242" r="4.5"/>
  </g>

  <!-- Motor stool, carrying the thrust bearing. -->
  <path d="M506 252h88l-12 60h-64z" fill="var(--mimic-surface, #f8f9fa)"/>
  <g id="part-thrust-bearing" data-part="PS-THRUST-BRG" stroke="var(--mimic-part-thrust-bearing, var(--mimic-line, #495057))">
    <rect x="524" y="260" width="52" height="20" rx="3" fill="var(--mimic-surface, #f8f9fa)"/>
    <circle cx="537" cy="270" r="4.5"/>
    <circle cx="563" cy="270" r="4.5"/>
  </g>
  <g id="part-thrust-pad" data-part="PS-AXIAL-PAD" stroke="var(--mimic-part-thrust-pad, var(--mimic-line, #495057))">
    <rect x="528" y="286" width="18" height="10" rx="2" fill="var(--mimic-surface, #f8f9fa)"/>
    <rect x="554" y="286" width="18" height="10" rx="2" fill="var(--mimic-surface, #f8f9fa)"/>
  </g>

  <!-- Bearing cooling water: a cooler, and its lines to the housing. -->
  <g id="part-water-cooling" data-part="PS-WATER-COOLING" stroke="var(--mimic-part-water-cooling, var(--mimic-line, #495057))">
    <path d="M576 266h64M576 276h64" stroke-width="1.6"/>
    <rect x="640" y="254" width="58" height="34" rx="4" fill="var(--mimic-water, #d0ebff)"/>
    <path d="M648 271l7-9l7 18l7-18l7 18l7-18l7 9" stroke-width="1.4"/>
  </g>

  <!-- Shaft column and coupling, through the floor to the pump. -->
  <rect x="543" y="312" width="14" height="92" fill="var(--mimic-surface, #f8f9fa)"/>
  <rect x="532" y="376" width="36" height="10" rx="2" fill="var(--mimic-surface, #f8f9fa)"/>

  <!-- Guide bearing on the column, and its radial pad. -->
  <g id="part-guide-bearing" data-part="PS-GUIDE-BRG" stroke="var(--mimic-part-guide-bearing, var(--mimic-line, #495057))">
    <rect x="530" y="338" width="40" height="22" rx="3" fill="var(--mimic-surface, #f8f9fa)"/>
  </g>
  <g id="part-guide-pad" data-part="PS-RADIAL-PAD" stroke="var(--mimic-part-guide-pad, var(--mimic-line, #495057))">
    <rect x="516" y="340" width="12" height="18" rx="2" fill="var(--mimic-surface, #f8f9fa)"/>
  </g>

  <!-- Suction: bellmouth and pipe into the casing. -->
  <path d="M262 442l-22-9v38l22-9z" fill="var(--mimic-water, #d0ebff)"/>
  <path d="M262 442h242v20H262z" fill="var(--mimic-water, #d0ebff)"/>
  <path d="M370 452h34m-9-6l9 6l-9 6" stroke-width="1.6"/>

  <!-- Discharge line, and the two valves on it. -->
  <g id="part-discharge" data-part="PS-DISCHARGE" stroke="var(--mimic-part-discharge, var(--mimic-line, #495057))">
    <path d="M592 422h246v20H592z" fill="var(--mimic-water, #d0ebff)"/>
    <path d="M838 417l26 15l-26 15z" fill="var(--mimic-water, #d0ebff)"/>
    <path d="M618 432h34m-9-6l9 6l-9 6" stroke-width="1.6"/>
  </g>
  <g id="part-eopd-valve" data-part="PS-EOPD-VALVE" stroke="var(--mimic-part-eopd-valve, var(--mimic-line, #495057))">
    <path d="M690 416l18 16l-18 16zM726 416l-18 16l18 16z" fill="var(--mimic-surface, #f8f9fa)"/>
    <path d="M708 432v-30"/>
    <rect x="696" y="384" width="24" height="18" rx="3" fill="var(--mimic-surface, #f8f9fa)"/>
  </g>
  <g id="part-hopd-valve" data-part="PS-HOPD-VALVE" stroke="var(--mimic-part-hopd-valve, var(--mimic-line, #495057))">
    <path d="M768 416l18 16l-18 16zM804 416l-18 16l18 16z" fill="var(--mimic-surface, #f8f9fa)"/>
    <path d="M786 432v-30"/>
    <path d="M776 402h20v-22h-20zM776 391h20" fill="var(--mimic-surface, #f8f9fa)"/>
  </g>

  <!-- Pump casing and impeller, drawn last so the pipes meet it cleanly. Its
       fill is the bay's state. -->
  <g id="part-casing" data-part="PS-CASING" stroke="var(--mimic-part-casing, var(--mimic-state-line, #495057))">
    <circle cx="550" cy="452" r="48" fill="var(--mimic-state, #e9ecef)"/>
    <circle cx="550" cy="452" r="13" fill="var(--mimic-surface, #f8f9fa)"/>
    <g stroke-width="1.6">
      <path d="M550 439q14-3 25-21"/>
      <path d="M550 439q14-3 25-21" transform="rotate(60 550 452)"/>
      <path d="M550 439q14-3 25-21" transform="rotate(120 550 452)"/>
      <path d="M550 439q14-3 25-21" transform="rotate(180 550 452)"/>
      <path d="M550 439q14-3 25-21" transform="rotate(240 550 452)"/>
      <path d="M550 439q14-3 25-21" transform="rotate(300 550 452)"/>
    </g>
  </g>

  <g id="pump-status" data-point="/pd/{pump}/st"/>
  <g id="pump-power" data-point="/dex/PUMP{pump_number}_ACTIVE_POWER"/>
  <g id="pump-speed" data-point="/dex/PUMP{pump_number}_SPEED"/>
  <g id="pump-pressure" data-point="/dex/PUMP{pump_number}_DISCHARGE_PRESSURE"/>
  <g id="pump-flow" data-point="/pd/{pump}/dv"/>
</svg>
